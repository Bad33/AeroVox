name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to trigger the build manually from the UI

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev zip unzip autoconf libtool pkg-config zlib1g-dev openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Compile APK
        run: |
          # Force pure Python for charset_normalizer just in case
          export CHARSET_NORMALIZER_USE_MYPYC=0
          yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snore-recorder-apk
          path: bin/*.apk
